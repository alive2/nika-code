name: Deploy Update Worker

# DISABLED: auto-deploy of the Cloudflare Worker is turned off. The repo has
# no CLOUDFLARE_API_TOKEN secret configured, so every push touching
# build/update/** or product.json failed with a red check ("In a non-
# interactive environment, it's necessary to set a CLOUDFLARE_API_TOKEN...").
# The worker is deployed manually instead (cd build/update && npx wrangler
# deploy). NOTE: a workflow file with no `on:` key is invalid, and GitHub
# creates a failing run (and notification emails) for it on every push — so
# this file declares a manual-only `workflow_dispatch` trigger to stay valid
# without ever auto-running.
#
# To re-enable auto-deploy:
#   1. Create a Cloudflare API token with "Workers Scripts: Edit" permission:
#      https://dash.cloudflare.com/profile/api-tokens
#   2. Add it as a GitHub Actions secret named CLOUDFLARE_API_TOKEN
#      (repo Settings -> Secrets and variables -> Actions), or via
#      `gh secret set CLOUDFLARE_API_TOKEN`.
#   3. Restore the push trigger:
#      on:
#        push:
#          branches: [main]
#          paths:
#            - 'build/update/**'
#            - 'product.json'

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: build/update
          command: deploy
